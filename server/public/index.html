<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Green Corridor — Phase 3 Test Page</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
    label { display: block; margin-top: 10px; }
    input, select, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 8px 16px; }
    li { margin-bottom: 8px; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    hr { margin: 30px 0; }
  </style>
</head>
<body>
  <h2>Report a Hazard</h2>
  <form id="hazardForm">
    <label>Type
      <select name="type">
        <option value="pothole">Pothole</option>
        <option value="waterlogging">Waterlogging</option>
        <option value="blockage">Blockage</option>
      </select>
    </label>
    <label>Severity
      <select name="severity">
        <option value="minor">Minor</option>
        <option value="moderate" selected>Moderate</option>
        <option value="blocked">Blocked</option>
      </select>
    </label>
    <label>From node
      <select name="fromNode" id="fromNode"></select>
    </label>
    <label>To node
      <select name="toNode" id="toNode"></select>
    </label>
    <label>Description <textarea name="description"></textarea></label>
    <button type="submit">Submit report</button>
  </form>

  <h3>Reported hazards</h3>
  <ul id="hazardList"></ul>

  <hr />

  <h2>Test a route</h2>
  <form id="routeForm">
    <label>Start node <select name="start" id="startNode"></select></label>
    <label>Goal node <select name="goal" id="goalNode"></select></label>
    <button type="submit">Compute route</button>
  </form>
  <pre id="routeResult"></pre>

  <script>
    const NODES = ["A","B","C","D","E","F","G","H","I"];
    for (const sel of [fromNode, toNode, startNode, goalNode]) {
      sel.innerHTML = NODES.map(n => `<option value="${n}">${n}</option>`).join("");
    }
    goalNode.value = "I"; // matches the algorithm/graph.js sample layout

    const hazardForm = document.getElementById("hazardForm");
    const list = document.getElementById("hazardList");

    async function loadHazards() {
      const res = await fetch("/hazards");
      const hazards = await res.json();
      list.innerHTML = hazards
        .map(h => `<li>${h.type} (${h.severity}): ${h.fromNode} → ${h.toNode} — ${h.description || "no description"}</li>`)
        .join("");
    }

    hazardForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(hazardForm));
      const res = await fetch("/hazards", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        alert((await res.json()).error);
        return;
      }
      hazardForm.reset();
      goalNode.value = "I";
      loadHazards();
    });

    const routeForm = document.getElementById("routeForm");
    const routeResult = document.getElementById("routeResult");

    routeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const { start, goal } = Object.fromEntries(new FormData(routeForm));
      const res = await fetch(`/route?start=${start}&goal=${goal}`);
      routeResult.textContent = JSON.stringify(await res.json(), null, 2);
    });

    loadHazards();
  </script>
</body>
</html>
